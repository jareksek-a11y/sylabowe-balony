<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sylabowe balony</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* Główne style */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* EKRAN STARTOWY */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
        }
        
        .bg-balloons {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .bg-balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.3;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 32px;
            font-family: Arial, sans-serif;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .start-btn:active { transform: scale(0.95); }

        /* EKRAN GRY */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #header {
            text-align: center;
            padding: 15px 10px;
            font-size: 28px;
            border-bottom: 2px solid #eee;
            background-color: #fff;
            z-index: 5;
        }

        #target-display {
            font-weight: bold;
            color: #00b300; /* Żywy, wyraźny zielony */
            font-size: 72px; /* Dwukrotnie powiększona */
            display: block;
            margin-top: 10px;
        }

        #play-area {
            position: relative;
            flex-grow: 1; /* Zajmuje resztę ekranu pod nagłówkiem */
            width: 100%;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #fff; /* Biały tekst lepiej widać na bardzo jaskrawych tłach */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); /* Cień dla lepszej czytelności */
            cursor: pointer;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, top 2s ease-in;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 15px;
            background-color: #999;
        }

        .balloon.popped {
            transform: scale(0);
            transition: transform 0.1s;
        }

        .balloon.fly-up {
            top: -200px !important;
        }

        /* EKRAN KOŃCOWY */
        #end-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 20;
            justify-content: center;
            align-items: center;
        }

        #huge-syllable {
            font-size: 150px;
            font-weight: bold;
            color: #00b30
