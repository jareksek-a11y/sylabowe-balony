<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sylabowe balony</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* Główne style */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* EKRAN STARTOWY */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background-color: #ffffff;
        }
        
        .bg-balloons {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .bg-balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.3;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 32px;
            font-family: Arial, sans-serif;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .start-btn:active { transform: scale(0.95); }

        /* EKRAN GRY */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #header {
            text-align: center;
            padding: 15px 10px;
            font-size: 28px;
            border-bottom: 2px solid #eee;
            background-color: #fff;
            z-index: 5;
        }

        #target-display {
            font-weight: bold;
            color: #00b300; /* Żywy, wyraźny zielony */
            font-size: 72px; /* Dwukrotnie powiększona */
            display: block;
            margin-top: 10px;
        }

        #play-area {
            position: relative;
            flex-grow: 1; /* Zajmuje resztę ekranu pod nagłówkiem */
            width: 100%;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #fff; /* Biały tekst lepiej widać na bardzo jaskrawych tłach */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); /* Cień dla lepszej czytelności */
            cursor: pointer;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, top 2s ease-in;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 15px;
            background-color: #999;
        }

        .balloon.popped {
            transform: scale(0);
            transition: transform 0.1s;
        }

        .balloon.fly-up {
            top: -200px !important;
        }

        /* EKRAN KOŃCOWY */
        #end-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 20;
            justify-content: center;
            align-items: center;
        }

        #huge-syllable {
            font-size: 150px;
            font-weight: bold;
            color: #00b300;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="app">
    <div id="start-screen">
        <div class="bg-balloons" id="bg-balloons"></div>
        <button class="start-btn" onclick="startGame()">Rozpocznij Grę</button>
    </div>

    <div id="game-screen">
        <div id="header">
            Rozbij wszystkie balony oprócz tych z sylabą:
            <div id="target-display"></div>
        </div>
        <div id="play-area"></div>
    </div>

    <div id="end-overlay">
        <div id="huge-syllable"></div>
    </div>
</div>

<script>
    // --- KONFIGURACJA ---
    const GOOGLE_SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTe2PjBIM3fnfwHKBQJWeIGk4HWkyIi68TslThSjoDFnYKc_1MzZWy2b24NiU-k1LZnPGg2gWGUw3r1/pub?gid=0&single=true&output=csv'; 
    
    let syllablesList = ['MA', 'PA', 'TA', 'DA', 'BA', 'KA', 'LA', 'SA', 'WA', 'ZA', 'RO', 'BO', 'TO', 'KO', 'NO'];
    
    let currentTarget = '';
    let badBalloonsLeft = 15;
    let isTransitioning = false;

    // --- SYSTEM DŹWIĘKOWY (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playFallSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function playErrorSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    // --- SYSTEM MOWY (Web Speech API) ---
    function speak(text, callback) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pl-PL';
        utterance.rate = 0.9;
        
        if (callback) {
            utterance.onend = callback;
        }
        window.speechSynthesis.speak(utterance);
    }

    // --- POBIERANIE DANYCH Z GOOGLE SHEETS ---
    async function loadSyllables() {
        if (!GOOGLE_SHEETS_CSV_URL) return;
        try {
            const response = await fetch(GOOGLE_SHEETS_CSV_URL);
            const data = await response.text();
            const parsed = data.split('\n').map(row => row.split(',')[0].trim().toUpperCase()).filter(s => s);
            if (parsed.length > 5) {
                syllablesList = parsed;
            }
        } catch (e) {
            console.log("Nie udało się pobrać danych z Google Sheets, używam listy zapasowej.", e);
        }
    }

    // --- GENEROWANIE EKRANU STARTOWEGO ---
    function createBgBalloons() {
        const container = document.getElementById('bg-balloons');
        const colors = ['#FF1493', '#00FF00', '#00BFFF', '#FF4500', '#FFD700', '#8A2BE2', '#FF00FF'];
        for(let i=0; i<30; i++) {
            let b = document.createElement('div');
            b.className = 'bg-balloon';
            let size = Math.random() * 80 + 40;
            b.style.width = size + 'px';
            b.style.height = (size * 1.2) + 'px';
            b.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            b.style.left = Math.random() * 100 + 'vw';
            b.style.top = Math.random() * 100 + 'vh';
            container.appendChild(b);
        }
    }

    // --- LOGIKA GRY ---
    async function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        await loadSyllables();
        startLevel();
    }

    function startLevel() {
        isTransitioning = false;
        badBalloonsLeft = 15;
        document.getElementById('end-overlay').style.display = 'none';
        
        currentTarget = syllablesList[Math.floor(Math.random() * syllablesList.length)];
        document.getElementById('target-display').innerText = currentTarget;

        speak(`Rozbij wszystkie balony oprócz tych z sylabą ${currentTarget}`);

        // Opóźniamy generowanie balonów, aby obszar gry zdążył się prawidłowo wyrenderować i podać poprawne wymiary
        setTimeout(generateBalloons, 50); 
    }

    function generateBalloons() {
        const playArea = document.getElementById('play-area');
        playArea.innerHTML = '';
        
        const areaRect = playArea.getBoundingClientRect();
        
        let levelSyllables = [];
        for(let i=0; i<5; i++) levelSyllables.push(currentTarget);
        
        let wrongSyllables = syllablesList.filter(s => s !== currentTarget);
        for(let i=0; i<15; i++) {
            levelSyllables.push(wrongSyllables[Math.floor(Math.random() * wrongSyllables.length)]);
        }
        
        levelSyllables.sort(() => Math.random() - 0.5);

        // Bardzo żywe, jaskrawe kolory
        const colors = ['#FF0055', '#00DD00', '#00AAFF', '#FF6600', '#FFCC00', '#AA00FF', '#FF00AA'];
        
        const placedBalloons = [];

        levelSyllables.forEach(syl => {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            // Rozmiar nieco dostosowany, aby 20 balonów łatwiej się zmieściło bez nakładania
            let width = Math.random() * 40 + 60; 
            let height = width * 1.25;
            
            balloon.style.width = width + 'px';
            balloon.style.height = height + 'px';
            balloon.style.fontSize = (width / 2.5) + 'px';
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // ALGORYTM ZAPOBIEGAJĄCY NAKŁADANIU SIĘ BALONÓW
            let isPlaced = false;
            let attempts = 0;
            let finalX = 0;
            let finalY = 0;

            while (!isPlaced && attempts < 150) {
                // Losowanie pozycji w granicach playArea
                let x = Math.random() * (areaRect.width - width - 20) + 10;
                let y = Math.random() * (areaRect.height - height - 20) + 10;
                
                let hasCollision = false;
                let padding = 5; // Odstęp między balonami

                for (let b of placedBalloons) {
                    if (x < b.x + b.width + padding &&
                        x + width + padding > b.x &&
                        y < b.y + b.height + padding &&
                        y + height + padding > b.y) {
                        hasCollision = true;
                        break;
                    }
                }

                if (!hasCollision) {
                    finalX = x;
                    finalY = y;
                    isPlaced = true;
                }
                attempts++;
            }

            // Zapisujemy pozycję, aby kolejne balony mogły ją omijać
            placedBalloons.push({x: finalX, y: finalY, width: width, height: height});

            balloon.style.left = finalX + 'px';
            balloon.style.top = finalY + 'px';
            
            balloon.innerText = syl;
            balloon.dataset.syl = syl;

            balloon.onclick = () => handleBalloonClick(balloon);
            
            playArea.appendChild(balloon);
        });
    }

    function handleBalloonClick(balloon) {
        if (isTransitioning || balloon.classList.contains('popped')) return;

        const syl = balloon.dataset.syl;

        if (syl !== currentTarget) {
            badBalloonsLeft -= 1;
            playFallSound();
            balloon.classList.add('popped');
            
            setTimeout(() => { balloon.remove(); }, 100);

            if (badBalloonsLeft === 0) {
                levelComplete();
            }
        } else {
            playErrorSound();
            balloon.style.transform = 'scale(0.9) rotate(5deg)';
            setTimeout(() => { balloon.style.transform = ''; }, 100);
        }
    }

    function levelComplete() {
        isTransitioning = true;
        
        const remainingBalloons = document.querySelectorAll('.balloon');
        remainingBalloons.forEach(b => {
            b.classList.add('fly-up');
        });

        setTimeout(() => {
            const overlay = document.getElementById('end-overlay');
            overlay.style.display = 'flex';
            document.getElementById('huge-syllable').innerText = currentTarget;
            
            speak(`Świetnie ci poszło, zostały tylko balony z sylabą ${currentTarget}`, () => {
                setTimeout(() => {
                    speak('Spróbujmy z inną sylabą', () => {
                        startLevel();
                    });
                }, 250);
            });
        }, 1000);
    }

    createBgBalloons();

</script>
</body>
</html>
